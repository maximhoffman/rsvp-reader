  <g fill="#d4d4d4" xml:space="preserve">
    <text x="236" y="66" fill="#777">▾</text>
    <text x="200" y="92" font-size="22">rec<tspan fill="#ff5f56" font-weight="bold">o</tspan>gnition</text>
